[package]
name = "tss-rust"
version = "0.1.0"
edition = "2021"

[lints.rust]
non_camel_case_types = "allow"
unused-parens = "allow"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["software-crypto"]

# Build the RustCrypto-backed CryptoProvider. Disabling this drops every pure-Rust crypto
# dependency, leaving the caller to supply a provider of their own.
software-crypto = [
    "dep:aes",
    "dep:cipher",
    "dep:hmac",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:elliptic-curve",
    "dep:rand",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:sm3",
]

# Build the CNG-backed CryptoProvider. This adds no dependencies: it calls bcrypt.dll through the
# windows bindings the crate already uses, and it is inert on non-Windows targets.
cng-crypto = []

[dependencies]
derivative = "2.2.0"
lazy_static = "1.5.0"
windows = "0.61.1"
zeroize = "1.8"

# Used only by the software-crypto provider.
aes = { version = "0.8", optional = true }
cipher = { version = "0.4", features = ["block-padding"], optional = true }
hmac = { version = "0.12.1", optional = true }
rand = { version = "0.8", optional = true }
rsa = { version = "0.9.8", optional = true }
sha1 = { version = "0.10.6", features = ["oid"], optional = true }
sha2 = { version = "0.10.8", features = ["oid"], optional = true }
sm3 = { version = "0.4.2", optional = true }

# The NIST prime curves a TPM may nominate for an ECC storage key, and the generic traits that
# let one agreement routine serve all three. Default features are off because they would pull in
# the ECDSA, PKCS#8 and PEM stacks, none of which this provider uses: it only ever agrees.
elliptic-curve = { version = "0.13", default-features = false, features = ["ecdh", "sec1"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdh"], optional = true }
p384 = { version = "0.13", default-features = false, features = ["ecdh"], optional = true }
p521 = { version = "0.13", default-features = false, features = ["ecdh"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_TpmBaseServices", "Win32_Networking", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "tpm_samples"
path = "examples/tpm_samples.rs"
# Every sample opens an HMAC session, which derives its session key on the host, so the samples
# cannot run without a crypto backend compiled in.
required-features = ["software-crypto"]
